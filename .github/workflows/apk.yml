name: Android APK

# Her push'ta analiz + test çalışır ve telefona kurulabilir bir APK üretir.
# APK: Actions sekmesi → ilgili çalışma → Artifacts → kamu-pusulasi-apk.
# Bu APK deneme içindir (debug anahtarıyla imzalı); mağaza yayını için release.yml
# (imzalı AAB) kullanılır.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kamu-pusulasi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
