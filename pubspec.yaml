name: pusula
description: Kamu Pusulası - kamu çalışanının cebindeki maaş, hak, becayiş, ilan ve haber rehberi.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  in_app_purchase: ^3.2.0
  lucide_icons_flutter: ^3.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Yazı tipleri uygulamaya gömülüdür (çevrimdışı çalışır, ağdan yazı tipi çekilmez).
  # Sora, Figtree ve Noto Sans: SIL Open Font License 1.1. Sora ve Figtree'de ₺
  # işareti yok; PusulaLira, Noto Sans'tan yalnızca ₺ glifi alınarak üretilmiş
  # küçük bir yedek yazıdır (fontFamilyFallback olarak kullanılır).
  fonts:
    - family: PusulaLira
      fonts:
        - asset: assets/fonts/PusulaLira-400.ttf
          weight: 400
        - asset: assets/fonts/PusulaLira-700.ttf
          weight: 700
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
